[project]
name = "user-service"
version = "0.1.0"
description = "User Service API"
readme = "README.md"
authors = [
    { name = "DulshanSiriwardhana", email = "dulshansiriwardhanaofficial@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pymongo[srv]>=4.17.0",
    "dnspython>=2.6.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "cryptography>=42.0.0",
    "pyjwt>=2.7.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "sentry-sdk>=1.40.0",
]

[tool.vercel]
entrypoint = "api.index:app"